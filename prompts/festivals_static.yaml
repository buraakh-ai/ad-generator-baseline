# Fallback festival/holiday table, only consulted by tools/festival_tool.py
# when the installed `holidays` package doesn't expose India's categorized
# Hindu/Islamic festivals. Keyed by ISO date (YYYY-MM-DD).
#
# IMPORTANT — keep this updated:
#   - Diwali, Dussehra/Vijayadashami, Holi, Eid al-Fitr, Eid al-Adha follow
#     lunar/lunisolar calendars, so their Gregorian dates shift every year
#     and must be re-verified annually (Eid dates especially can move by a
#     day depending on moon sighting).
#   - Republic Day (Jan 26) and Independence Day (Aug 15) for India, and
#     July 4th / Christmas / New Year's Day for the US, are fixed and don't
#     need updates.
#   - US holidays that fall on a fixed weekday (Thanksgiving, Labor Day,
#     Presidents Day, Memorial Day, MLK Day) are already covered accurately
#     by the `holidays` package's US calendar and are only duplicated here
#     as a safety net.

"2026-01-01": [{country: "US", name: "New Year's Day"}]
